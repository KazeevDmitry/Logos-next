# Frontend on its own. The full stack (api, db, mail) lives in ../Logos-api/compose.yml.
services:
  web:
    build:
      context: .
      target: dev
    # Next.js reads .env / .env.local from the mounted source itself.
    environment:
      # The API container of ../Logos-api, reached through the host.
      API_INTERNAL_URL: http://host.docker.internal:4000
      NEXT_PUBLIC_WS_URL: http://localhost:4000
    ports:
      - "3000:3000"
    volumes:
      # node_modules stays inside the mounted folder (installed by the container,
      # never by the host) so the editor's TypeScript server can read the types.
      - .:/app
      - web_next:/app/.next

volumes:
  web_next:
