# Frontend on its own. The full stack (api, db, mail) lives in ../Logos-api/compose.yml.
services:
  web:
    build:
      context: .
      target: dev
    # Next.js reads .env / .env.local from the mounted source itself.
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next

volumes:
  web_node_modules:
  web_next:
